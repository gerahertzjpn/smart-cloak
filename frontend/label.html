<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タグ印刷｜LUGGAGE CLOAK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ラベルプリンター用（62mm × 40mm）。プリンターに合わせてサイズを変更すること。 */
    @page { size: 62mm 40mm; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans JP", sans-serif; background: #e9e9e9; color: #111; }
    .toolbar { padding: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .toolbar button { font: inherit; font-weight: 700; padding: 10px 22px; border-radius: 8px; border: 0; background: #c9a961; cursor: pointer; }
    .toolbar p { margin: 0; color: #555; font-size: 13px; }
    .labels { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 16px 16px; }
    .label {
      width: 62mm; height: 40mm; background: #fff; padding: 2.5mm;
      display: grid; grid-template-columns: 30mm 1fr; gap: 2.5mm; align-items: center;
      break-after: page; page-break-after: always; overflow: hidden;
    }
    .label img { width: 30mm; height: 30mm; }
    .label .shelf { font-family: "Cormorant Garamond", serif; font-size: 34px; font-weight: 700; line-height: 1; }
    .label .type { font-size: 12px; font-weight: 700; margin-top: 1.5mm; }
    .label .guest { font-size: 10px; margin-top: 1mm; }
    .label .count { font-size: 10px; color: #444; }
    .label .brand { font-family: "Cormorant Garamond", serif; font-size: 8px; letter-spacing: 0.2em; margin-top: 1.5mm; }
    .error { padding: 16px; color: #b00; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .labels { padding: 0; gap: 0; display: block; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" id="print">🖨 印刷する</button>
    <p>各タグを荷物に貼り、タグに書かれた棚番号の棚へ収納してください。</p>
  </div>
  <div class="labels" id="labels"></div>
  <script type="module" src="/js/label.js"></script>
</body>
</html>
