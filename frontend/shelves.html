<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>棚の状況｜LUGGAGE CLOAK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="app-header"></header>
  <main>
    <h1 class="page-title">棚の状況</h1>
    <p class="page-lead" id="summary"></p>

    <div class="tabs" role="tablist">
      <button class="active" data-tab="map" role="tab">棚マップ</button>
      <button data-tab="search" role="tab">写真で探す（タグ脱落時）</button>
    </div>

    <section id="tab-map">
      <div id="unassigned"></div>
      <div id="areas"></div>
    </section>

    <section id="tab-search" hidden>
      <p class="muted">タグが外れた荷物は、種類とイベントで絞り込み、写真を見比べて持ち主を探します。</p>
      <div class="filters">
        <select id="f-type"><option value="">すべての種類</option></select>
        <select id="f-event"><option value="">すべてのイベント</option></select>
      </div>
      <div class="item-cards" id="search-results"></div>
    </section>
  </main>
  <script type="module" src="/js/shelves.js"></script>
</body>
</html>
